# ==========================================================
#  BuildFFA - Server Default Kit Settings
#  File: kit-setting.yml
#
#  This file defines the DEFAULT kit that every player gets
#  when they join / respawn / clear their inventory.
#
#  Player-specific kits (saved in SQLite via /buildffa kiteditor)
#  OVERRIDE this default kit.
#
#  ENCHANTMENT NAMES (1.8.8):
#    DAMAGE_ALL          Sharpness
#    DAMAGE_UNDEAD       Smite
#    DAMAGE_ARTHROPODS   Bane of Arthropods
#    KNOCKBACK           Knockback
#    FIRE_ASPECT         Fire Aspect
#    LOOT_BONUS_MOBS     Looting
#    DIG_SPEED           Efficiency
#    SILK_TOUCH          Silk Touch
#    DURABILITY          Unbreaking
#    LOOT_BONUS_BLOCKS   Fortune
#    ARROW_DAMAGE        Power
#    ARROW_KNOCKBACK     Punch
#    ARROW_FIRE          Flame
#    ARROW_INFINITE      Infinity
#    PROTECTION_ENVIRONMENTAL  Protection
#    PROTECTION_EXPLOSIONS     Blast Protection
#    PROTECTION_FALL           Feather Falling
#    PROTECTION_FIRE           Fire Protection
#    PROTECTION_PROJECTILE     Projectile Protection
#    OXYGEN              Respiration
#    WATER_WORKER        Aqua Affinity
#    THORNS              Thorns
#    DEPTH_STRIDER       Depth Strider
#
#  COLOR options (leather armor only):
#    RED, BLUE, GREEN, YELLOW, AQUA, BLACK, WHITE, PURPLE, ORANGE,
#    FUCHSIA, GRAY, SILVER, LIME, MAROON, NAVY, OLIVE, TEAL
#    OR "r,g,b"   example:  "255,0,0"
#    OR "#RRGGBB" example:  "#FF0000"
#
#  ATTACK-DAMAGE:
#    Optional. Overrides the vanilla attack damage of the item.
#    Example: attack-damage: 7.5
#
#  POTION EFFECTS (for POTION items):
#    effects:
#      - 'JUMP:1:4'      # JUMP, duration in seconds, amplifier (0=I, 4=V)
#      - 'SPEED:180:1'   # SPEED, 180s, amplifier 1 (Speed II)
# ==========================================================

# ----------------------------------------------------------
#  ARMOR
#  Helmet + Chestplate = Leather RED (Protection II, Unbreakable)
#  Leggings + Boots    = Diamond    (Protection II, Unbreakable)
# ----------------------------------------------------------
armor:

  # ⭐ چرم قرمز — Helmet + Protection II
  helmet:
    type: LEATHER_HELMET
    color: RED
    unbreakable: true
    name: ''
    lore: []
    enchantments:
      - 'PROTECTION_ENVIRONMENTAL:2'

  # ⭐ چرم قرمز — Chestplate + Protection II
  chestplate:
    type: LEATHER_CHESTPLATE
    color: RED
    unbreakable: true
    name: ''
    lore: []
    enchantments:
      - 'PROTECTION_ENVIRONMENTAL:2'

  # ⭐ الماس — Leggings + Protection II
  leggings:
    type: DIAMOND_LEGGINGS
    unbreakable: true
    name: ''
    lore: []
    enchantments:
      - 'PROTECTION_ENVIRONMENTAL:2'

  # ⭐ الماس — Boots + Protection II
  boots:
    type: DIAMOND_BOOTS
    unbreakable: true
    name: ''
    lore: []
    enchantments:
      - 'PROTECTION_ENVIRONMENTAL:2'

# ----------------------------------------------------------
#  ITEMS - inventory slots 0 to 35
#  'slot' is the inventory slot number (0 = first hotbar)
# ----------------------------------------------------------
items:

  # ⭐ STONE SWORD — Sharpness II, 7.5 Attack Damage
  sword:
    slot: 0
    type: STONE_SWORD
    amount: 1
    unbreakable: true
    attack-damage: 7.5
    name: ''
    lore: []
    enchantments:
      - 'DAMAGE_ALL:2'

  # ⭐ WOOL (cyan) — 64 blocks
  wool:
    slot: 1
    type: WOOL
    data: 9
    amount: 64
    unbreakable: false
    name: ''
    lore: []
    enchantments: []

  # ⭐ SHEARS — Unbreakable
  shears:
    slot: 2
    type: SHEARS
    amount: 1
    unbreakable: true
    name: ''
    lore: []
    enchantments: []

  # ⭐ WOODEN AXE — Efficiency I, 3 Attack Damage (NOT unbreakable, like vanilla wood)
  axe:
    slot: 3
    type: WOODEN_AXE
    amount: 1
    unbreakable: false
    attack-damage: 3.0
    name: ''
    lore: []
    enchantments:
      - 'DIG_SPEED:1'

  # ⭐ WOODEN PICKAXE — Efficiency II, 2 Attack Damage
  pickaxe:
    slot: 4
    type: WOODEN_PICKAXE
    amount: 1
    unbreakable: false
    attack-damage: 2.0
    name: ''
    lore: []
    enchantments:
      - 'DIG_SPEED:2'

  # ⭐ JUMP V POTION — 3 minutes (180s), amplifier 4 = Jump Boost V
  jump-potion:
    slot: 5
    type: POTION
    amount: 1
    unbreakable: false
    name: '&aPotion of Leaping V'
    lore:
      - '&7Drink to jump higher!'
    enchantments: []
    effects:
      - 'JUMP:180:4'

