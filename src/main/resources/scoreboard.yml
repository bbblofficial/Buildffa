# ==========================================================
#  BuildFFA Scoreboard Configuration
#  Version: 4.0  |  Compatible: 1.8.8
#  Theme: Aqua / White / Dark-Aqua (No Bold)
#  Created by Muvixo | Author: VanSaMa | Made by PixelValley
# ==========================================================

enabled: true
update-interval: 10
join-delay: 5

# ----------------------------------------------------------
#  Title Animation (Aqua & White, no bold)
# ----------------------------------------------------------
title:
  animated: true
  static: '&bBuildFFA'
  frames:
    - '&bB&fuildFFA'
    - '&bBu&fildFFA'
    - '&bBui&flldFFA'
    - '&bBuil&fdFFA'
    - '&bBuild&fFFA'
    - '&bBuildF&fFA'
    - '&bBuildFF&fA'
    - '&bBuildFFA'

# ----------------------------------------------------------
#  Scoreboard Lines
#  Theme:
#    &b  = Aqua (main accent)
#    &f  = White (values)
#    &3  = Dark Aqua (dividers)
#    &7  = Gray (subtle)
#    &8  = Dark Gray (separator)
# ----------------------------------------------------------
lines:
  - '&3&m----------------'
  - '&bPlayer &8» &f%player%'
  - '&bKills &8» &f%kills%'
  - '&bDeaths &8» &f%deaths%'
  - '&bKDR &8» &f%kdr%'
  - '&bStreak &8» &f%killstreak%'
  - '&3&m----------------'
  - '&bOnline &8» &f%online%&7/&f%max_online%'
  - '&bPing &8» &f%ping%ms'
  - '&3&m----------------'
  - '&bPlay.MineStorm.iR'
  - '&3&m----------------'

# ----------------------------------------------------------
#  Per-World Scoreboards
# ----------------------------------------------------------
per-world:
  enabled: false
  worlds:
    world:
      - '&3&m----------------'
      - '&bOVERWORLD'
      - '&3&m----------------'
      - '&bPlayer &8» &f%player%'
      - '&bKills &8» &f%kills%'
      - '&bDeaths &8» &f%deaths%'
      - '&bKDR &8» &f%kdr%'
      - '&3&m----------------'
      - '&bOnline &8» &f%online%'
      - '&3&m----------------'
      - '&bPlay.MineStorm.iR'
      - '&3&m----------------'
    world_nether:
      - '&3&m----------------'
      - '&bNETHER'
      - '&3&m----------------'
      - '&bPlayer &8» &f%player%'
      - '&bKills &8» &f%kills%'
      - '&bDeaths &8» &f%deaths%'
      - '&bKDR &8» &f%kdr%'
      - '&3&m----------------'
      - '&bOnline &8» &f%online%'
      - '&3&m----------------'
      - '&bPlay.MineStorm.iR'
      - '&3&m----------------'

# ----------------------------------------------------------
#  Toggle
# ----------------------------------------------------------
allow-toggle: true
toggle-permission: 'buildffa.scoreboard.toggle'