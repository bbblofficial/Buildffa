# ==========================================================
#  BuildFFA Scoreboard Configuration
#  Version: 4.0  |  Compatible: 1.8.8
#  Created by Muvixo | Author: VanSaMa | Made by PixelValley
# ==========================================================

enabled: true
update-interval: 10
join-delay: 5

# ----------------------------------------------------------
#  Title Animation
# ----------------------------------------------------------
title:
  animated: true
  static: '&6&lBuildFFA'
  frames:
    - '&6&lB&e&luildFFA'
    - '&6&lBu&e&lildFFA'
    - '&6&lBui&e&lldFFA'
    - '&6&lBuil&e&ldFFA'
    - '&6&lBuild&e&lFFA'
    - '&6&lBuildF&e&lFA'
    - '&6&lBuildFF&e&lA'
    - '&6&lBuildFFA'

# ----------------------------------------------------------
#  Scoreboard Lines
#  IMPORTANT: Max 16 visible characters per line on 1.8.8!
#  Use &-codes for colors. No unicode emoji (❤ ★ ✔) — they break.
#  Placeholders: %player% %kills% %deaths% %online%
#                %max_online% %world% %ping% %health%
#                %food% %y% %highlimit% %void%
# ----------------------------------------------------------
lines:
  - '&7&m----------------'
  - '&fPlayer &8» &e%player%'
  - '&fKills  &8» &a%kills%'
  - '&fDeaths &8» &c%deaths%'
  - '&7&m----------------'
  - '&fOnline &8» &b%online%&7/&b%max_online%'
  - '&fWorld  &8» &d%world%'
  - '&fPing   &8» &e%ping%ms'
  - '&fHealth &8» &c%health%'
  - '&7&m----------------'
  - '&6play.pixelvalley.gg'
  - '&7&m----------------'

# ----------------------------------------------------------
#  Per-World Scoreboards
# ----------------------------------------------------------
per-world:
  enabled: false
  worlds:
    world:
      - '&7&m----------------'
      - '&a&lOVERWORLD'
      - '&7&m----------------'
      - '&fPlayer &8» &e%player%'
      - '&fKills  &8» &a%kills%'
      - '&fDeaths &8» &c%deaths%'
      - '&7&m----------------'
      - '&fOnline &8» &b%online%'
      - '&7&m----------------'
      - '&6play.pixelvalley.gg'
      - '&7&m----------------'
    world_nether:
      - '&7&m----------------'
      - '&c&lNETHER'
      - '&7&m----------------'
      - '&fPlayer &8» &e%player%'
      - '&fKills  &8» &a%kills%'
      - '&fDeaths &8» &c%deaths%'
      - '&7&m----------------'
      - '&fOnline &8» &b%online%'
      - '&7&m----------------'
      - '&6play.pixelvalley.gg'
      - '&7&m----------------'

# ----------------------------------------------------------
#  Toggle
# ----------------------------------------------------------
allow-toggle: true
toggle-permission: 'buildffa.scoreboard.toggle'