# ==========================================================
#  BuildFFA Scoreboard Configuration
#  Version: 4.0  |  Compatible: 1.8.8
#  Created by Muvixo | Author: VanSaMa | Made by PixelValley
# ==========================================================

enabled: true
update-interval: 10
join-delay: 5

# ----------------------------------------------------------
#  Title Animation
# ----------------------------------------------------------
title:
  animated: true
  static: '&6&lBuildFFA'
  frames:
    - '&6&lB&e&luildFFA'
    - '&6&lBu&e&lildFFA'
    - '&6&lBui&e&lldFFA'
    - '&6&lBuil&e&ldFFA'
    - '&6&lBuild&e&lFFA'
    - '&6&lBuildF&e&lFA'
    - '&6&lBuildFF&e&lA'
    - '&6&lBuildFFA'

# ----------------------------------------------------------
#  Scoreboard Lines
#  Max 16 visible chars per line on 1.8.8
#  No unicode emoji — use text or symbols like :
#  Placeholders: %player% %kills% %deaths% %online%
#                %max_online% %world% %ping% %health%
#                %food% %y% %highlimit% %void%
# ----------------------------------------------------------
lines:
  - '&7&m----------------'
  - '&fPlayer: &e%player%'
  - '&fKills: &a%kills%'
  - '&fDeaths: &c%deaths%'
  - '&7&m----------------'
  - '&fOnline: &b%online%&7/&b%max_online%'
  - '&fWorld: &d%world%'
  - '&fPing: &e%ping%ms'
  - '&fHealth: &c%health%'
  - '&7&m----------------'
  - '&6play.pixelvalley.gg'
  - '&7&m----------------'

# ----------------------------------------------------------
#  Per-World Scoreboards
# ----------------------------------------------------------
per-world:
  enabled: false
  worlds:
    world:
      - '&7&m----------------'
      - '&a&lOVERWORLD'
      - '&7&m----------------'
      - '&fPlayer: &e%player%'
      - '&fKills: &a%kills%'
      - '&fDeaths: &c%deaths%'
      - '&7&m----------------'
      - '&fOnline: &b%online%'
      - '&7&m----------------'
      - '&6play.pixelvalley.gg'
      - '&7&m----------------'
    world_nether:
      - '&7&m----------------'
      - '&c&lNETHER'
      - '&7&m----------------'
      - '&fPlayer: &e%player%'
      - '&fKills: &a%kills%'
      - '&fDeaths: &c%deaths%'
      - '&7&m----------------'
      - '&fOnline: &b%online%'
      - '&7&m----------------'
      - '&6play.pixelvalley.gg'
      - '&7&m----------------'

# ----------------------------------------------------------
#  Toggle
# ----------------------------------------------------------
allow-toggle: true
toggle-permission: 'buildffa.scoreboard.toggle'