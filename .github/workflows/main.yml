name: Build BuildFFA Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BuildFFA-Plugin
        path: target/BuildFFA-*.jar

    - name: Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        files: target/BuildFFA-*.jar
        tag_name: v3.1-${{ github.run_number }}
        name: BuildFFA v3.1 Build ${{ github.run_number }}
        body: |
          BuildFFA Plugin v3.1
          Created by Muvixo
          Plugin author: VanSaMa
          Made by PixelValley
          
          ## Features
          - Kit Editor system
          - /buildffa kiteditor - Open kit editor
          - /buildffa setvoid - Set void kill height
          - /buildffa sethighlimit - Set high build limit
          - /buildffa creator - Show credits
          - /buildffa reload - Reload config
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
