name: Build BuildFFA Plugin (1.8.8)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package

    - name: Verify JAR contains plugin.yml
      run: |
        jar tf target/BuildFFA-4.0.jar | grep plugin.yml || (echo "PLUGIN.YML MISSING!" && exit 1)

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BuildFFA-Plugin
        path: target/BuildFFA-*.jar

    - name: Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        files: target/BuildFFA-*.jar
        tag_name: v4.0-${{ github.run_number }}
        name: BuildFFA v4.0 Build ${{ github.run_number }}
        body: |
          BuildFFA Plugin v4.0 (1.8.8 Compatible)
          Created by Muvixo
          Plugin author: VanSaMa
          Made by PixelValley

          ## Features
          - GUI Kit Editor
          - No item drops or pickups
          - Kit restored on /clear, death, void
          - Fixed high-limit bug
          - Infinite food and blocks
          - All previous features
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
